name: Sync upstream

on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/togg53192-cmd/jailbreaks.git
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit
          git push origin main
